name: Build XSamkokMod Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Dobby (iOS ARM64)
        run: |
          mkdir -p include lib
          if [ ! -f "include/dobby.h" ] || [ ! -f "lib/libdobby.a" ]; then
            curl -L https://github.com/jmpews/Dobby/releases/latest/download/dobby-ios-all.tar.gz -o dobby.tar.gz || true
            if tar -tzf dobby.tar.gz >/dev/null 2>&1; then
              tar -xzf dobby.tar.gz -C /tmp
              find /tmp -name "dobby.h" -exec cp {} include/dobby.h \;
              find /tmp -name "libdobby.a" -exec cp {} lib/libdobby.a \;
            else
              git clone --depth 1 https://github.com/jmpews/Dobby.git /tmp/dobby-src
              cmake -S /tmp/dobby-src -B /tmp/dobby-build \
                -DCMAKE_SYSTEM_NAME=iOS \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
                -DDOBBY_BUILD_EXAMPLE=OFF \
                -DDOBBY_BUILD_TEST=OFF
              cmake --build /tmp/dobby-build --config Release -j4
              cp /tmp/dobby-src/include/dobby.h include/dobby.h
              find /tmp/dobby-build -name "libdobby.a" -exec cp {} lib/libdobby.a \;
            fi
          fi

      - name: Compile XSamkokMod.dylib (Native Xcode Clang)
        run: |
          mkdir -p output
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos clang++ -dynamiclib \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=13.0 \
            -std=c++17 \
            -fobjc-arc \
            -O2 \
            -I./include \
            -L./lib \
            -ldobby \
            -framework UIKit \
            -framework Foundation \
            -framework JavaScriptCore \
            -install_name @executable_path/Frameworks/XSamkokMod.dylib \
            Tweak.mm \
            -o output/XSamkokMod.dylib

      - name: Ad-hoc Sign Dylib
        run: |
          codesign -f -s - output/XSamkokMod.dylib

      - name: Upload XSamkokMod.dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XSamkokMod-arm64
          path: output/XSamkokMod.dylib
