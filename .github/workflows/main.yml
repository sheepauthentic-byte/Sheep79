name: Build XSamkokMod Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Theos & Official iOS SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Install Procursus ldid
        run: |
          brew install ldid || true
          if ! command -v ldid &> /dev/null; then
            curl -L https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64 -o /usr/local/bin/ldid
            chmod +x /usr/local/bin/ldid
          fi

      - name: Build Dylib with Theos
        env:
          THEOS: ${{ runner.home }}/theos
        run: |
          make all

      - name: Collect & Sign Dylib
        run: |
          mkdir -p output
          find .theos/obj -name "XSamkokMod.dylib" -exec cp {} output/XSamkokMod.dylib \;
          ldid -S output/XSamkokMod.dylib

      - name: Upload XSamkokMod.dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XSamkokMod-arm64
          path: output/XSamkokMod.dylib
